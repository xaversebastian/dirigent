# Cursor Task-tool / agent GPT-5.6 adapter
# Verified against agent --list-models on 2026-08-05.

runtime: cursor
family: gpt-5.6
description: Cursor-exposed GPT-5.6 models for subagent dispatch

tiers:
  reasoning-high:
    dispatch: gpt-5.6-sol-xhigh
    label: Sol
    notes: Frontier profile using the exact Cursor-exposed slug.

  balanced:
    dispatch: gpt-5.6-terra-medium
    label: Terra
    notes: Balanced everyday tier for standard implementation blocks.

  mechanical:
    dispatch: gpt-5.6-luna-medium
    label: Luna
    fallback: lead-sequential
    notes: Luna is available in the 2026-08-05 catalog (fixture updated).

dispatch:
  parameter: model
  override: supported
  allowed:
    - gpt-5.6-sol-xhigh
    - gpt-5.6-sol-high
    - gpt-5.6-terra-medium
    - gpt-5.6-terra-high
    - gpt-5.6-luna-medium
    - gpt-5.6-luna-high
  explore_default: gpt-5.6-terra-medium
