# Cursor Task-tool runtime adapter
# Maps portable capability tiers to Cursor subagent model slugs.
# Verified against the Cursor subagent schema available on 2026-07-10.
# Treat exposed identifiers as complete slugs; do not infer missing variants.

runtime: cursor
family: gpt-5.6
description: Cursor-exposed GPT-5.6 models for subagent dispatch

tiers:
  reasoning-high:
    dispatch: gpt-5.6-sol-xhigh
    label: Sol
    notes: Frontier profile using the exact Cursor-exposed slug.

  balanced:
    dispatch: gpt-5.6-terra-medium
    label: Terra
    notes: Balanced everyday tier for standard implementation blocks.

  mechanical:
    dispatch: gpt-5.6-terra-medium
    label: Terra fallback
    fallback: lead-sequential
    notes: No Luna slug is exposed; use Terra or execute sequentially in the lead.

dispatch:
  parameter: model
  override: supported
  allowed:
    - gpt-5.6-sol-xhigh
    - gpt-5.6-terra-medium
  explore_default: gpt-5.6-terra-medium
