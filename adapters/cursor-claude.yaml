# Cursor Claude subagent adapter
# Verified against agent --list-models on 2026-09-05 (this workspace account).
# Task-tool enum may be a subset; prefer IDs present in both when unsure.

runtime: cursor
provider: anthropic
description: Cursor-exposed Claude models for subagent dispatch

tiers:
  reasoning-high:
    dispatch: claude-opus-5-thinking-xhigh
    profile: high-reasoning
    alternatives:
      owner-second-opinion: claude-fable-5-1-thinking-high
      fable-xhigh: claude-fable-5-1-thinking-xhigh
      opus-high: claude-opus-5-thinking-high
      legacy-opus48: claude-opus-4-8-thinking-high
    notes: "Default Cursor Anthropic worker is Opus 5 thinking xhigh. Fable 5.1 is owner-manual second opinion, not the auto default. MFC must not dispatch Claude via Cursor."

  balanced:
    dispatch: claude-sonnet-5-thinking-high
    profile: balanced

  mechanical:
    dispatch: claude-sonnet-5-thinking-high
    profile: balanced-fallback
    fallback: lead-sequential
    notes: Prefer Composer via the grok-composer adapter for mechanical cost lane.

dispatch:
  parameter: model
  override: supported
  allowed:
    - claude-opus-5-thinking-xhigh
    - claude-opus-5-thinking-high
    - claude-opus-5-thinking-medium
    - claude-opus-4-8-thinking-high
    - claude-fable-5-1-thinking-high
    - claude-fable-5-1-thinking-xhigh
    - claude-sonnet-5-thinking-high
    - claude-sonnet-5-thinking-xhigh
  explore_default: claude-sonnet-5-thinking-high
