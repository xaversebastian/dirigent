# Claude Code / Cursor Agent runtime adapter
# Maps portable capability tiers to Claude model overrides.

runtime: claude
description: Anthropic Claude model families for Agent/Task dispatch

tiers:
  reasoning-high:
    dispatch: opus
    label: Opus
    aliases:
      - fable
    notes: >
      Use `opus` as default. Use `fable` when the runtime exposes it and the
      block needs extended thinking at the top tier (analogous role to sol).

  balanced:
    dispatch: sonnet
    label: Sonnet

  mechanical:
    dispatch: haiku
    label: Haiku

dispatch:
  parameter: model
  allowed: [opus, fable, sonnet, haiku]
  explore_default: sonnet
