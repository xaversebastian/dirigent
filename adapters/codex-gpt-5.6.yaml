# Codex GPT-5.6 runtime adapter
# Maps portable capability tiers to Codex model slugs.
# Verified against ~/.codex/models_cache.json (2026-07-10).
#
# Tier (sol/terra/luna) is separate from reasoning effort (low..ultra).
# Codex canonical slugs omit the effort suffix; set effort via Codex config
# or per-request reasoning settings. Cursor uses composite *-medium slugs —
# see adapters/cursor-gpt-5.6.yaml.

runtime: codex
family: gpt-5.6
description: OpenAI GPT-5.6 Sol / Terra / Luna for Codex subagent dispatch

tiers:
  reasoning-high:
    dispatch: gpt-5.6-sol
    label: Sol
    notes: >
      Frontier agentic coding model (Codex priority 1). Supports reasoning
      effort low through ultra. Default reasoning level: low.

  balanced:
    dispatch: gpt-5.6-terra
    label: Terra
    notes: >
      Balanced agentic coding model for everyday work (priority 2). Default
      reasoning level: medium.

  mechanical:
    dispatch: gpt-5.6-luna
    label: Luna
    notes: >
      Fast, affordable agentic coding model (priority 3). Default reasoning
      level: medium. No ultra effort on this tier.

dispatch:
  parameter: model
  allowed:
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-5.6-luna
  explore_default: gpt-5.6-terra
