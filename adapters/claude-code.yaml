# Claude Code runtime adapter
# Verified against Claude Code 2.1.261 --help on 2026-09-05.
# Alias `fable` resolves to Claude Fable 5.1 (`claude-fable-5-1`).

runtime: claude-code
description: Claude Code aliases for worker dispatch

tiers:
  reasoning-high:
    dispatch: opus
    profile: high-reasoning
    effort: xhigh
    alternatives:
      owner-second-opinion: fable
    notes: "Default high tier is Opus 5 with --effort xhigh. Fable 5.1 is owner-manual second opinion only. Fable and Opus are distinct models."

  balanced:
    dispatch: sonnet
    profile: balanced

  mechanical:
    dispatch: sonnet
    profile: balanced-fallback
    fallback: lead-sequential
    notes: No lower-capability alias is asserted by the verified local CLI help.

dispatch:
  parameter: model
  override: when-supported
  allowed:
    - fable
    - opus
    - sonnet
  explore_default: sonnet
